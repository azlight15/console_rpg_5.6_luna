# 这个工作流专门用于本项目的 .NET 构建和自动化测试。
# 本项目是控制台 RPG，不是 WPF/WinForms，因此不需要桌面应用打包流程。

name: .NET Core Desktop

on:
  push:
    branches: [ "main", "tests" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 恢复依赖
        run: dotnet restore Tests/Console_RPG.Tests/Console_RPG.Tests.csproj

      - name: 编译游戏和测试项目
        run: dotnet build Tests/Console_RPG.Tests/Console_RPG.Tests.csproj --no-restore

      - name: 运行自动化测试
        run: dotnet run --project Tests/Console_RPG.Tests/Console_RPG.Tests.csproj --no-build
