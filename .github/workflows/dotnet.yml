# GitHub 会在 push 和 Pull Request 时自动运行这套检查。
# tests 分支用于开发测试；main 仍然保持稳定版本。

name: .NET Build and Test

on:
  push:
    branches: [ "main", "tests" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 恢复依赖
        run: dotnet restore Tests/Console_RPG.Tests/Console_RPG.Tests.csproj

      - name: 编译游戏和测试项目
        run: dotnet build Tests/Console_RPG.Tests/Console_RPG.Tests.csproj --no-restore

      - name: 运行自动化测试
        run: dotnet test Tests/Console_RPG.Tests/Console_RPG.Tests.csproj --no-build --verbosity normal
